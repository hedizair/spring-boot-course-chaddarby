<!DOCTYPE html>
<html lang='en' 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    >

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm text-center" style="width: 100%; max-width: 500px;">
            <div class="card-body p-4">
                <h2 class="card-title mb-3 text-danger">Access Denied</h2>
                <hr>
                <p class="card-text mb-4">Sorry, you don't have permission to access this page.</p>

                <a href="#" th:href="@{/}" class="btn btn-outline-primary">Back to Home</a>

            </div>
        </div>
    </div>
</body>

</html>
