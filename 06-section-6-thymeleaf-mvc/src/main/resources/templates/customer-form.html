<!DOCTYPE html>
<html lang='en' xmlns="http://www.thymeleaf.org">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Customer Registration</title>
    <link rel='stylesheet' th:href='@{/css/demo.css}' />
</head>

<body>
    <div class="page-container">
        <p class="page-title"> Customer Registration Form </p>

        <form th:action="@{/processCustomerForm}" th:object="${customer}" method="POST">

            <div class="form-group">
                <label class="form-label" for="firstName">First name: </label>
                <input class="form-input" type="text" th:field="*{firstName}" />
            </div>
            <br>
            <div class="form-group">
                <label class="form-label" for="lastName">Last name (*): </label>
                <input class="form-input" type="text" th:field="*{lastName}" />
            </div>

            <!-- Add the error message if present -->

            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error"></span>
            <br>
            <div class="form-group">
                <label class="form-label" for="freePasses">Free passes (*): </label>
                <input class="form-input" type="text" th:field="*{freePasses}"  />
            </div>
            <span th:if="${#fields.hasErrors('freePasses')}" th:errors="*{freePasses}" class="error"></span>

            <br>

            <div class="form-group">
                <label class="form-label" for="postalCode">Postal code: </label>
                <input class="form-input" type="text" th:field="*{postalCode}"  />
            </div>
            <span th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}" class="error"></span>

            <br>
            <div class="form-group">
                <label class="form-label" for="courseCode">Course code: </label>
                <input class="form-input" type="text" th:field="*{courseCode}"  />
            </div>
            <span th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}" class="error"></span>

            <br>
            <input class="btn btn-primary" type="submit" value="Submit" />
        </form>
    </div>
</body>

</html>
