
# Custom  error to handle java errors on form inputs/validation (instead of big java stack trace)

# typeMismatch = error type
# customer = spring model attribute name
# freePasses = field name
# Invalid number = our custom message

# All errors are available on BindingResult.toString() on the controllers
# If we use symply typeMismatch, all the typeMismatch error on the projects will use this error message

typeMismatch.customer.freePasses=Invalid number

# This will handle all the Integer type mismatch on the form valiadtions
# typeMismatch.java.lang.Integer=Invalid number Global